name: rinha-fraud

x-api: &api
  image: rinha-fraud:local
  build:
    context: .
    args:
      # nlist baked into index.bin at build time (passo 05). Maior = células
      # menores = query mais rápida (p99 menor); build offline aguenta.
      KNN_NLIST: "4096"
      KNN_KMEANS_ITERS: "8"
  environment:
    ADDR: ":8080"
    GOMAXPROCS: "1"
    GOMEMLIMIT: "150MiB"
    # GC só dispara perto do limite de memória (live set ~54MB << 150MiB), então
    # gasta-se quase nada de CPU em GC sob carga. Ver passo 04.
    GOGC: "off"
    # Índice pré-construído em /app/index.bin (INDEX_PATH vem do Dockerfile).
    # KNN_NPROBE retuna o índice no startup, SEM rebuild: nº de células varridas
    # por query (maior = mais recall, mais lento). Ver passo 03/05.
    KNN_NPROBE: "12"
  networks:
    - app
  deploy:
    resources:
      limits:
        cpus: "0.45"
        memory: "155MB"

services:
  api1:
    <<: *api

  api2:
    <<: *api

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    networks:
      - app
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "40MB"

networks:
  app:
    driver: bridge
