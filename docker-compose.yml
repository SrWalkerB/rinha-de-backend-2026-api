name: rinha-fraud

# ============================================================================
# docker-compose.yml da BRANCH `submission`.
#
# Regras (docs/br/ARQUITETURA.md + SUBMISSAO.md):
#   - SEM `build:` aqui — a branch submission NÃO pode ter código-fonte.
#   - A imagem precisa estar PUBLICAMENTE disponível (Docker Hub / ghcr).
#   - Soma dos limites de TODOS os serviços <= 1 CPU e 350 MB.
#
# >>> TROQUE `srwalkerb/rinha-fraud:TAG` pela SUA imagem pública (publish.ps1).
# Use uma TAG NOVA a cada push pra evitar cache da engine (pull_policy: always
# garante pull fresco). A imagem já carrega o index.bin (IVF pré-construído).
# ============================================================================

x-api: &api
  image: srwalkerb/rinha-fraud:2.3
  pull_policy: always
  environment:
    ADDR: ":8080"
    # 1->2: cada api processa requests CONCORRENTES (fila M/M/1 -> M/M/2) -> corta
    # a cauda do p99 no Mac. CPU/req igual (mesma cota 0.35). O Ryzen local nem
    # forma fila (1.5ms), só o Haswell lento do Mac enfileira -> testar via prévia.
    GOMAXPROCS: "2"
    GOMEMLIMIT: "150MiB"
    # GC só dispara perto do limite de memória (live set ~88MB << 150MiB).
    GOGC: "off"
    # Células IVF varridas por query. np32 corta failures (E31->14, det +99) MAS
    # ~2x CPU/query -> no Mac lento (api 0.35, ~64% ocupada @ np16) provavelmente
    # SATURA (Err>0). Local nao mostra (Ryzen rapido). Manter 16; cortar failures
    # via nprobe ADAPTATIVO (so queries de fronteira) depois. Runtime, sem rebuild.
    INDEX_NPROBE: "16"
  networks:
    - app
  deploy:
    resources:
      limits:
        # p99 era throttle CFS por SUB-PROVISÃO. Sweep local (k6, img 2.1) achou um
        # U: precisa alimentar OS DOIS. nginx<~0.3 -> nginx trava (p99 ~1100ms);
        # api<~0.3 -> api trava (p99 ~960ms); ambos >=~0.3 -> p99 despenca (dezenas
        # de ms, Err=0). Split: nginx 0.30 + api 0.35x2 = 1.00. api 0.35 dá folga
        # pra subir nprobe depois (detecção) sem voltar a travar.
        cpus: "0.35"
        memory: "155MB"

services:
  api1:
    <<: *api

  api2:
    <<: *api

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    networks:
      - app
    deploy:
      resources:
        limits:
          # 0.10 -> 0.30: tira o throttle (cota CFS 10ms -> 30ms/100ms). Acima de
          # ~0.3 não ganha mais (ver sweep); o resto vai pras apis.
          cpus: "0.30"
          memory: "40MB"

networks:
  app:
    driver: bridge
