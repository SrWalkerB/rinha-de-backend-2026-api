name: rinha-fraud

# ============================================================================
# docker-compose.yml da BRANCH `submission`.
#
# Regras (docs/br/ARQUITETURA.md + SUBMISSAO.md):
#   - SEM `build:` aqui — a branch submission NÃO pode ter código-fonte.
#   - A imagem precisa estar PUBLICAMENTE disponível (Docker Hub / ghcr).
#   - Soma dos limites de TODOS os serviços <= 1 CPU e 350 MB.
#
# >>> TROQUE `srwalkerb/rinha-fraud:TAG` pela SUA imagem pública (publish.ps1).
# Use uma TAG NOVA a cada push pra evitar cache da engine (pull_policy: always
# garante pull fresco). A imagem já carrega o index.bin (IVF pré-construído).
# ============================================================================

x-api: &api
  # IMAGEM 5.4 = 5.3 (escalada incremental + nlist 1024) + contador de diagnóstico
  # (inócuo). Config 5.4 = base nprobe 16 (p99 é util-bound, não compute). PUBLICAR:
  # publish.ps1 -User srwalkerb -Tag 5.4
  image: srwalkerb/rinha-fraud:5.4
  pull_policy: always
  environment:
    ADDR: ":8080"
    GOMAXPROCS: "1"
    GOMEMLIMIT: "150MiB"
    # GC só dispara perto do limite de memória (live set ~88MB << 150MiB).
    GOGC: "off"
    # Config 5.4 (env-only, MESMA imagem 5.3): BASE nprobe 32→16. DESCOBERTA: o p99 do
    # Mac NÃO é compute-bound (cortar 47% das linhas só moveu 5.79→5.64ms; CENTROID
    # evals p99=4096 << WORK p99 106k → compute real ~50µs vs p99 5.6ms = 100×). O p99
    # é UTILIZAÇÃO/throttle: base nprobe=32 dobra o compute de TODA query (mean WORK
    # 13k→26k) → satura a API (ρ→1) → fila amplifica o p99. img 4.0 @np16 deu p99 2.56ms
    # real (util ~56%). np16 + escalada por-voto p/ E=0 → volta ao regime ~2.56ms. A
    # escalada (3%) quase não move a util média → custo de escalada é ~neutro no p99,
    # então generoso no boundary (count2=256) p/ margem de E no Mac. diag E=0/det=3000,
    # mm=16 (concentrado em count0/5 unânimes, longe do 0.6 → não flipam; boundary
    # escala p/ high → tight). Espera p99 5.6→~3ms.
    INDEX_NPROBE: "16"
    INDEX_NPROBE_HIGH: "256"
    INDEX_NPROBE_HIGH_C2: "256"
    INDEX_NPROBE_HIGH_C3: "192"
    INDEX_NPROBE_HIGH_C4: "128"
    INDEX_TRIGGER_MARGIN: "1"
  networks:
    - app
  deploy:
    resources:
      limits:
        # CPU sweep (2026-06-02, app centroid-SIMD): o LB L4 STARVA <0.20 (joelho) —
        # lb0.10 deu p99 156ms/final 3354 (= regressão da 3.0). Em lb>=0.20 o p99
        # colapsa. Config: lb 0.25 / api 0.375x2 = 1.00 (lb folgado acima do joelho
        # p/ slack do CFS do Mac; api 0.375 > 0.35 do nginx, alimenta o scoring).
        cpus: "0.375"
        memory: "155MB"

services:
  api1:
    <<: *api

  api2:
    <<: *api

  # LB próprio (L4 splice) no lugar do nginx — mesma imagem, entrypoint /app/lb.
  # Satisfaz "≥1 load balancer + ≥2 instâncias" (é um LB, só não-nginx). Mais leve
  # que nginx (segura em 0.25 vs ~0.30 do nginx; STARVA <0.20 — joelho medido).
  # Balance api1/api2 ok (skew ~1.0x sob k6: RR-por-conexão equilibra com muitas VUs).
  lb:
    image: srwalkerb/rinha-fraud:5.4
    pull_policy: always
    entrypoint: ["/app/lb"]
    environment:
      LB_ADDR: ":9999"
      LB_BACKENDS: "api1:8080,api2:8080"
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    networks:
      - app
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "32MB"

networks:
  app:
    driver: bridge
