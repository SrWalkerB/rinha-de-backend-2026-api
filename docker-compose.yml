name: rinha-fraud

# ============================================================================
# docker-compose.yml da BRANCH `submission`.
#
# Regras (docs/br/ARQUITETURA.md + SUBMISSAO.md):
#   - SEM `build:` aqui — a branch submission NÃO pode ter código-fonte.
#   - A imagem precisa estar PUBLICAMENTE disponível (Docker Hub / ghcr).
#   - Soma dos limites de TODOS os serviços <= 1 CPU e 350 MB.
#
# >>> TROQUE `srwalkerb/rinha-fraud:TAG` pela SUA imagem pública (publish.ps1).
# Use uma TAG NOVA a cada push pra evitar cache da engine (pull_policy: always
# garante pull fresco). A imagem já carrega o index.bin (IVF pré-construído).
# ============================================================================

x-api: &api
  image: srwalkerb/rinha-fraud:2.1
  pull_policy: always
  environment:
    ADDR: ":8080"
    GOMAXPROCS: "1"
    GOMEMLIMIT: "150MiB"
    # GC só dispara perto do limite de memória (live set ~88MB << 150MiB).
    GOGC: "off"
    # Células IVF varridas por bucket/query. Maior = mais recall (melhor
    # detection_score), mais CPU. Sintonizar via testes de prévia: subir até o
    # p99 no Mac Mini se aproximar de 1ms. Sem rebuild (knob de runtime).
    INDEX_NPROBE: "16"
  networks:
    - app
  deploy:
    resources:
      limits:
        cpus: "0.45"
        memory: "155MB"

services:
  api1:
    <<: *api

  api2:
    <<: *api

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    networks:
      - app
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "40MB"

networks:
  app:
    driver: bridge
