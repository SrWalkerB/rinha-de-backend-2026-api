name: rinha-fraud

# ============================================================================
# docker-compose.yml de DESENVOLVIMENTO (build local).
#
# Builda a imagem a partir do código-fonte (Dockerfile) — o `buildindex` gera o
# index.bin embutido. Usado pelo run-test.ps1 para o teste de carga k6 local.
# O compose da SUBMISSÃO (sem build, por imagem pública) está em ./submission/.
#
# Soma dos limites de TODOS os serviços <= 1 CPU e 350 MB (regra da Rinha).
# ============================================================================

x-api: &api
  build:
    context: .
    dockerfile: Dockerfile
  image: srwalkerb/rinha-fraud:dev
  environment:
    ADDR: ":8080"
    GOMAXPROCS: "1"
    GOMEMLIMIT: "150MiB"
    # GC só dispara perto do limite de memória (live set ~88MB << 150MiB).
    GOGC: "off"
    # Busca 5-NN por IVF (k-means contíguo por bucket). Knob sintonizável SEM
    # rebuild: INDEX_NPROBE = células varridas por bucket/query (maior = mais
    # recall/det, mais lento). INDEX_MAX_SCAN = teto de linhas/query (guarda de cauda).
    INDEX_NPROBE: "32"
    INDEX_NPROBE_HIGH: "328"
    INDEX_TRIGGER_MARGIN: "1"
    INDEX_MAX_SCAN: "0"
  networks:
    - app
  deploy:
    resources:
      limits:
        # Sweep (2026-06-02): LB L4 starva <0.20 (joelho); api recebe (1-lb)/2. Config
        # escolhido = lb 0.25 / api 0.375x2 (lb folgado acima do joelho, api 0.375>0.35
        # do nginx). lb0.10/api0.45 = STARVADO (p99 ~156ms) — não use.
        cpus: "0.375"
        memory: "155MB"

services:
  api1:
    <<: *api

  api2:
    <<: *api

  # L4 load balancer (own binary, same image, /app/lb entrypoint). Replaces nginx:
  # an L7 proxy needed ~0.30 CPU to not throttle itself (U-curve); the L4 splice
  # proxy does near-zero per-byte work (splice(2) on Linux) → survives on 0.10,
  # freeing 0.20 for the CPU-bound APIs (0.45×2 here vs 0.35×2 under nginx).
  lb:
    image: srwalkerb/rinha-fraud:dev
    entrypoint: ["/app/lb"]
    environment:
      LB_ADDR: ":9999"
      LB_BACKENDS: "api1:8080,api2:8080"
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    networks:
      - app
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "32MB"

networks:
  app:
    driver: bridge
