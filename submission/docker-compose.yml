name: rinha-fraud

# ============================================================================
# docker-compose.yml da BRANCH `submission`.
#
# Regras (docs/br/ARQUITETURA.md + SUBMISSAO.md):
#   - SEM `build:` aqui — a branch submission NÃO pode ter código-fonte.
#   - A imagem precisa estar PUBLICAMENTE disponível (Docker Hub / ghcr).
#   - Soma dos limites de TODOS os serviços <= 1 CPU e 350 MB.
#
# >>> TROQUE `srwalkerb/rinha-fraud:TAG` pela SUA imagem pública (publish.ps1).
# Use uma TAG NOVA a cada push pra evitar cache da engine (pull_policy: always
# garante pull fresco). A imagem já carrega o index.bin (IVF pré-construído).
# ============================================================================

x-api: &api
  # IMAGEM NOVA (3.0) com o binário /app/lb embutido — PUBLICAR antes (publish.ps1).
  image: srwalkerb/rinha-fraud:3.0
  pull_policy: always
  environment:
    ADDR: ":8080"
    GOMAXPROCS: "1"
    GOMEMLIMIT: "150MiB"
    # GC só dispara perto do limite de memória (live set ~88MB << 150MiB).
    GOGC: "off"
    INDEX_NPROBE: "16"
  networks:
    - app
  deploy:
    resources:
      limits:
        # nginx (L7) precisava de ~0.30 CPU pra não se auto-throttlar (U-curve). O LB
        # próprio é L4 (splice) — sobrevive em 0.10 → libera 0.20 pras APIs: 0.45x2 +
        # lb 0.10 = 1.00 (local: lb@0.10 deu p99 87ms vs nginx@0.10 1142ms = não starva).
        cpus: "0.45"
        memory: "155MB"

services:
  api1:
    <<: *api

  api2:
    <<: *api

  # LB próprio (L4 splice) no lugar do nginx — mesma imagem, entrypoint /app/lb.
  # Satisfaz "≥1 load balancer + ≥2 instâncias" (é um LB, só não-nginx). Mais leve
  # que nginx → roda em 0.10 e devolve CPU pras APIs (CPU-bound).
  lb:
    image: srwalkerb/rinha-fraud:3.0
    pull_policy: always
    entrypoint: ["/app/lb"]
    environment:
      LB_ADDR: ":9999"
      LB_BACKENDS: "api1:8080,api2:8080"
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    networks:
      - app
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "32MB"

networks:
  app:
    driver: bridge
